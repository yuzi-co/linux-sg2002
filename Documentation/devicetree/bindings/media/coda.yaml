%YAML 1.2
---
$id: http://devicetree.org/schemas/media/coda.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Chips&Media Coda multi-standard codec IP

maintainers:
  - Philipp Zabel <p.zabel@pengutronix.de>

description: |-
  Coda codec IPs are present in i.MX SoCs in various versions, called VPU
  (Video Processing Unit). The Sophgo SG2002 integrates a Coda980 H.264 core
  with a separate video-codec control window.

properties:
  compatible:
    oneOf:
      - items:
          - const: fsl,imx27-vpu
          - const: cnm,codadx6
      - items:
          - const: fsl,imx51-vpu
          - const: cnm,codahx4
      - items:
          - const: fsl,imx53-vpu
          - const: cnm,coda7541
      - items:
          - enum:
              - fsl,imx6dl-vpu
              - fsl,imx6q-vpu
          - const: cnm,coda960
      - const: sophgo,sg2002-coda980

  reg:
    true

  reg-names:
    true

  clocks:
    true

  clock-names:
    true

  interrupts:
    true

  interrupt-names:
    true

  power-domains:
    maxItems: 1

  resets:
    maxItems: 1

  iram:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: phandle pointing to the SRAM device node

  firmware-name:
    $ref: /schemas/types.yaml#/definitions/string
    description: Firmware image loaded into the Coda processor.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

allOf:
  - if: # i.MX Coda960 has a separate JPEG interrupt
      properties:
        compatible:
          contains:
            const: cnm,coda960
    then:
      properties:
        interrupts:
          minItems: 2

        interrupt-names:
          minItems: 2
    else:
      properties:
        interrupts:
          maxItems: 1

        power-domains: false

  - if:
      properties:
        compatible:
          contains:
            const: sophgo,sg2002-coda980
    then:
      properties:
        reg:
          minItems: 2
          maxItems: 2
        reg-names:
          items:
            - const: vc-ctrl
            - const: h264
        clocks:
          minItems: 5
          maxItems: 5
        clock-names:
          items:
            - const: axi-video-codec
            - const: cfg-reg-vc
            - const: vc-src0
            - const: h264c
            - const: apb-h264c
        interrupts:
          maxItems: 1
        interrupt-names:
          items:
            - const: h264
        resets:
          maxItems: 1
      required:
        - reg-names
        - firmware-name
        - resets
    else:
      properties:
        reg:
          maxItems: 1
        reg-names: false
        firmware-name: false
        clocks:
          items:
            - description: PER clock
            - description: AHB interface clock
        clock-names:
          items:
            - const: per
            - const: ahb
        interrupts:
          minItems: 1
          items:
            - description: BIT processor interrupt
            - description: JPEG unit interrupt
        interrupt-names:
          minItems: 1
          items:
            - const: bit
            - const: jpeg

examples:
  - |
    vpu: video-codec@63ff4000 {
        compatible = "fsl,imx53-vpu", "cnm,coda7541";
        reg = <0x63ff4000 0x1000>;
        interrupts = <9>;
        clocks = <&clks 63>, <&clks 63>;
        clock-names = "per", "ahb";
        iram = <&ocram>;
    };

  - |
    #include <dt-bindings/clock/sophgo,cv1800.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    vcodec: video-codec@b030000 {
        compatible = "sophgo,sg2002-coda980";
        reg = <0x0b030000 0x100>, <0x0b010000 0x10000>;
        reg-names = "vc-ctrl", "h264";
        interrupts = <21 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "h264";
        clocks = <&clk CLK_AXI_VIDEO_CODEC>,
                 <&clk CLK_CFG_REG_VC>,
                 <&clk CLK_VC_SRC0>,
                 <&clk CLK_H264C>,
                 <&clk CLK_APB_H264C>;
        clock-names = "axi-video-codec", "cfg-reg-vc", "vc-src0",
                      "h264c", "apb-h264c";
        resets = <&rst RST_H264C>;
        firmware-name = "sophgo/sg2002/coda980.bin";
    };
